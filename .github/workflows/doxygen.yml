name: Doxygen

on:
  push:
    branches:
      - doxygen

permissions:
  contents: write

jobs:
  create_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Add Doxygen Awesome CSS
        run: git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git

      - name: Generate docs
        run: doxygen doxygen/Doxyfile_dev

      - name: Copy fonts alongside generated CSS
        run: cp -r doxygen/font docs/html/font

      - name: Deploy to docs branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: docs
          folder: docs/html
          token: ${{ secrets.GITHUB_TOKEN }}

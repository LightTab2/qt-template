name: Doxygen

on:
  push:
    branches:
      - main

jobs:
  create_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Doxygen Awesome CSS as submodule
        run: |
          if [ ! -d "doxygen-awesome-css" ]; then
            git submodule add https://github.com/jothepro/doxygen-awesome-css.git
          fi

      - name: Generate and deploy docs
        uses: DenverCoder1/doxygen-github-pages-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs
          config_file: doxygen/Doxyfile_dev

      - name: Add font to docs branch
        run: |
          git fetch origin docs
          git checkout -B docs origin/docs
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout origin/main -- doxygen/font
          git mv doxygen/font font
          rmdir doxygen 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add font"
          git push origin HEAD:docs

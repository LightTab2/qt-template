name: Windows

on:
  pull_request:
    branches:
      - main
  workflow_run:
    workflows:
      - Autotag
    types:
      - completed

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build_and_deploy:
    runs-on: windows-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       !contains(github.event.workflow_run.head_commit.message, '[ci skip]'))
    steps:
      - name: Extract repository name
        id: repoName
        run: |
          $REPO_NAME = "${{ github.repository }}"
          $REPO_NAME = $REPO_NAME.Split("/")[-1]
          echo "name=$REPO_NAME" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tags
        if: ${{ github.event_name == 'workflow_run' }}
        run: git fetch --tags origin

      - name: Get version tag
        id: versionTag
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          $LAST_TAGGED_COMMIT = git rev-list --tags --max-count=1
          $TAG = git describe --tags $LAST_TAGGED_COMMIT
          echo "tag=$TAG" >> $env:GITHUB_OUTPUT

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-${{ hashFiles('conan/conanfile.txt') }}
          restore-keys: |
            conan2-${{ runner.os }}-

      - name: Run Conan
        run: |
          conan profile detect --force
          conan install conan/ --build=missing

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-${{ runner.os }}'

      - name: Configure
        run: cmake -Bbuild -DCMAKE_TOOLCHAIN_FILE="conan/conan_toolchain.cmake"

      - name: Build
        run: cmake --build build --config Release --target install -j4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/
          ctest -C Release -VV

      - name: Zip artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          cd build/
          Rename-Item install "${{ steps.repoName.outputs.name }}"
          7z a -r "${{ steps.repoName.outputs.name }}_Win_${{ steps.versionTag.outputs.tag }}.zip" "${{ steps.repoName.outputs.name }}/*"

      - name: Create release artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ steps.repoName.outputs.name }}_Win_${{ steps.versionTag.outputs.tag }}.zip
          prerelease: true
          draft: true
          tag_name: ${{ steps.versionTag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
